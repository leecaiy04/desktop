name: Build Nextcloud Desktop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libssl-dev libsqlite3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6keychain1 qt6-keychain-dev \
            libkf6archive-dev \
            extra-cmake-modules \
            libxcb-cursor-dev \
            pkg-config \
            dpkg-dev fakeroot \
            wget

      - name: Configure (cmake)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Build deb package with CPack
        shell: bash
        run: |
          (
            cd build
            cpack -G DEB
          )

          shopt -s nullglob
          packages=(build/*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No deb package produced" >&2
            exit 1
          fi

          mv "${packages[0]}" "nextcloud-desktop_${{ matrix.arch }}.deb"

      - name: Build AppImage
        id: build-appimage
        env:
          BUILDNR: ${{ github.run_id }}
          VERSION_SUFFIX: ${{ github.ref_name }}
          BUILD_UPDATER: OFF
          DESKTOP_CLIENT_ROOT: ${{ github.workspace }}
          EXECUTABLE_NAME: nextcloud
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: /bin/bash ./admin/linux/build-appimage.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-deb-${{ matrix.arch }}
          path: nextcloud-desktop_${{ matrix.arch }}.deb

      - name: Upload AppImage artifact
        if: steps.build-appimage.outputs.APPIMAGE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-appimage-${{ matrix.arch }}
          path: ${{ steps.build-appimage.outputs.APPIMAGE_NAME }}
          compression-level: 0

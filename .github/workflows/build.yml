name: Build Nextcloud Desktop

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    container: ghcr.io/nextcloud/continuous-integration-client-appimage-qt6:client-appimage-el8-6.10.1-1
    name: Build (amd64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package
        env:
          BUILDNR: ${{ github.run_id }}
          VERSION_SUFFIX: ${{ github.ref_name }}
          BUILD_UPDATER: OFF
          DESKTOP_CLIENT_ROOT: ${{ github.workspace }}
          EXECUTABLE_NAME: nextcloud
          APPIMAGE_ARCH: x86_64
        run: /bin/bash ./admin/linux/build-appimage.sh

      - name: Extract deb from build
        run: |
          cd /app
          shopt -s nullglob
          debs=(*.deb)
          if [ "${#debs[@]}" -gt 0 ]; then
            cp "${debs[0]}" "${{ github.workspace }}/nextcloud-desktop_amd64.deb"
          fi

      - name: Upload deb artifact
        if: hashFiles('nextcloud-desktop_amd64.deb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-deb-amd64
          path: nextcloud-desktop_amd64.deb

      - name: Upload AppImage artifact
        if: hashFiles('*.AppImage') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-appimage-amd64
          path: "*.AppImage"
          compression-level: 0

  build-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build (arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build git \
            libssl-dev libsqlite3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6keychain1 qtkeychain-qt6-dev \
            qt6-websockets-dev qt6-svg-dev qt6-declarative-dev \
            libkf5archive-dev \
            libxcb-cursor-dev \
            pkg-config \
            dpkg-dev fakeroot \
            wget \
            libp11-dev \
            libbz2-dev liblzma-dev

      - name: Build and install ECM 6.0
        run: |
          cd /tmp
          git clone --depth 1 --branch v6.0.0 https://invent.kde.org/frameworks/extra-cmake-modules.git
          cd extra-cmake-modules
          cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          sudo cmake --install build

      - name: Build and install KF6Archive
        run: |
          cd /tmp
          git clone --depth 1 --branch v6.0.0 https://invent.kde.org/frameworks/karchive.git
          cd karchive
          sed -i 's/set(REQUIRED_QT_VERSION 6.5.0)/set(REQUIRED_QT_VERSION 6.4.0)/' CMakeLists.txt
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/cmake \
            -DBUILD_TESTING=OFF
          cmake --build build
          sudo cmake --install build

      - name: Build and install KDSingleApplication-qt6
        run: |
          cd /tmp
          git clone --depth 1 --branch v1.2.0 https://github.com/KDAB/KDSingleApplication.git
          cd KDSingleApplication
          cmake -B build -G Ninja \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKDSingleApplication_QT6=ON \
            -DKDSingleApplication_TESTS=OFF \
            -DKDSingleApplication_EXAMPLES=OFF
          cmake --build build
          sudo cmake --install build

      - name: Configure (cmake)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/cmake \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Build deb package with CPack
        shell: bash
        run: |
          (
            cd build
            cpack -G DEB
          )

          shopt -s nullglob
          packages=(build/*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No deb package produced" >&2
            exit 1
          fi

          mv "${packages[0]}" "nextcloud-desktop_arm64.deb"

      - name: Build AppImage
        id: build-appimage
        env:
          BUILDNR: ${{ github.run_id }}
          VERSION_SUFFIX: ${{ github.ref_name }}
          BUILD_UPDATER: OFF
          DESKTOP_CLIENT_ROOT: ${{ github.workspace }}
          EXECUTABLE_NAME: nextcloud
          APPIMAGE_ARCH: aarch64
        run: /bin/bash ./admin/linux/build-appimage.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-deb-arm64
          path: nextcloud-desktop_arm64.deb

      - name: Upload AppImage artifact
        if: steps.build-appimage.outputs.APPIMAGE_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-linux-appimage-arm64
          path: ${{ steps.build-appimage.outputs.APPIMAGE_NAME }}
          compression-level: 0
